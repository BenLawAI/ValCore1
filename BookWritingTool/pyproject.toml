[project]
name = "bookwritingtool"
version = "0.1.0"
description = "Professional book writing application with AI-powered style mixing, bestseller tracking, and complete publishing pipeline"
authors = [
    {name = "Master Builder", email = "ben@valcore.ai"}
]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "Proprietary"}

dependencies = [
    # GUI Framework
    "PyQt6>=6.6.0",
    "PyQt6-Qt6>=6.6.0",

    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",

    # LLM Providers
    "anthropic>=0.18.0",
    "openai>=1.12.0",
    "ollama>=0.1.0",
    "litellm>=1.30.0",

    # Web Scraping
    "playwright>=1.41.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",

    # Semantic Search & NLP
    "faiss-cpu>=1.7.4",
    "sentence-transformers>=2.3.0",
    "transformers>=4.37.0",
    "torch>=2.0.0",
    "spacy>=3.7.0",
    "nltk>=3.8.0",

    # Text Analysis
    "textstat>=0.7.3",

    # Export
    "python-docx>=1.1.0",
    "reportlab>=4.0.0",

    # Utilities
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.0",
    "schedule>=1.2.0",
    "loguru>=0.7.0",
    "tqdm>=4.66.0",
    "cryptography>=42.0.0",

    # HTTP & Networking
    "requests>=2.31.0",
    "urllib3>=2.2.0",

    # Data Science
    "numpy>=1.24.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "ipython>=8.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[project.scripts]
bookwriter = "app.main:main"
