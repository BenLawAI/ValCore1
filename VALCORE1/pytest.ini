[pytest]
# Pytest configuration for VALCORE1

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    -ra

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, may require resources)
    server: Server-side tests
    client: Client-side tests
    slow: Slow running tests
    gpu: Tests requiring GPU
    network: Tests requiring network access
    voice: Tests requiring voice/audio hardware

# Coverage options (if pytest-cov is installed)
# addopts = --cov=VALCORE1 --cov-report=html --cov-report=term

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout (if pytest-timeout is installed)
# timeout = 300

# Parallel execution (if pytest-xdist is installed)
# addopts = -n auto
