[pytest]
# Pytest configuration for VALCORE1 tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Test directories
testpaths = unit integration

# Markers for categorizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interactions
    slow: Slow tests that take >1 second
    requires_gpu: Tests that require CUDA/GPU
    requires_network: Tests that require network connectivity
    requires_audio: Tests that require audio devices

# Coverage options (if pytest-cov is installed)
# addopts = --cov=VALCORE1 --cov-report=html --cov-report=term

# Timeout for tests (requires pytest-timeout)
# timeout = 30
